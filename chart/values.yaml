# ===== 학생/앱 식별 (필수) =====
# host = <studentId>-realchat.std.kopoctc.kr
studentId: "kopo02"
appName: "realchat"

# ===== 앱(realchat Spring Boot) =====
replicaCount: 1

image:
  registry: std-harbor.kopoctc.kr
  repositoryApp: kopo02/realchat
  tag: "latest"                   # CI 가 SHA 태그로도 push → 오버라이드 가능
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: kopo02-regcred          # Harbor 인증 (사전 생성 필요)

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  host: ""                        # 비우면 _helpers 에서 <studentId>-realchat.std.kopoctc.kr 조합
  path: /
  pathType: Prefix

# ===== MySQL =====
mysql:
  image: mysql:8.0                # 공식 이미지 (Bitnami는 Kyverno 차단)
  database: realchat
  username: realchat
  persistence:
    size: 2Gi                     # 20Gi 학생 쿼터 고려
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 300m, memory: 512Mi }

# ===== 앱 리소스 (Grafana OOM 교훈: 충분한 limits) =====
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: "1", memory: 768Mi }   # Spring Boot + JPA + WS 여유

nameOverride: ""
fullnameOverride: ""
