# ============================================
# realchat Spring Boot — Deployment
# sync-wave "1": MySQL(0), ExternalSecret(0) 이후 배포
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "realchat.fullname" . }}
  labels:
    {{- include "realchat.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "realchat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "realchat.selectorLabels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: realchat
          image: {{ include "realchat.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # ★ ConfigMap(설정) + Secret(비밀) 순서 주입
          envFrom:
            - configMapRef:
                name: {{ include "realchat.fullname" . }}-config
            - secretRef:
                name: realchat-app-env
          # ★ 프로브 — 직접 명시 (매개변수화 복잡도 회피)
          startupProbe:               # Java 콜드스타트 대응: 30×10s=300초 윈도우
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
