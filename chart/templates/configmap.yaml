# ============================================
# ConfigMap — 비밀이 아닌 설정값 (Git 평문 커밋 무해)
# 실제 비밀번호/토큰은 ExternalSecret(externalsecret.yaml) 에서 별도 Secret 처리.
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "realchat.fullname" . }}-config
  labels:
    {{- include "realchat.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  # 첫 배포 자동 스키마 생성 (안정화 후 validate 권장)
  JPA_DDL_AUTO: "update"
  # 운영에서는 SQL 로그 끔 (I/O/보안)
  JPA_SHOW_SQL: "false"
