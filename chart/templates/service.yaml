# ============================================
# realchat Service — Ingress(traefik) 가 여기로 보냄
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "realchat.fullname" . }}
  labels:
    {{- include "realchat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "realchat.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
