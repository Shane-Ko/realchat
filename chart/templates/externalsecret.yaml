# ============================================
# Vault(via ESO SecretStore vault-backend) → 두 Secret 생성
#   1) realchat-mysql-auth : MySQL 컨테이너가 읽음 (root/user 비번)
#   2) realchat-app-env    : realchat 앱이 envFrom 으로 통째로 읽음 (DB_*, JWT_SECRET)
# ============================================
---
# 1) MySQL 인증용
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realchat-mysql-auth-es
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # ★ MySQL 보다 먼저
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: realchat-mysql-auth
  data:
    - secretKey: mysql-password
      remoteRef:
        key: realchat
        property: mysql-password
    - secretKey: mysql-root-password
      remoteRef:
        key: realchat
        property: mysql-root-password
---
# 2) 앱 환경변수용 (비번은 Vault에서, 고정값은 template 에서 조립)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: realchat-app-env-es
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: realchat-app-env
    template:
      data:
        # DB_HOST 는 release-mysql (StatefulSet Service 이름) 과 일치
        DB_HOST: {{ printf "%s-mysql" .Release.Name | quote }}
        DB_PORT: "3306"
        DB_NAME: {{ .Values.mysql.database | quote }}
        DB_USER: {{ .Values.mysql.username | quote }}
        DB_PASSWORD: "{{ `{{ .mysql_password }}` }}"
        # ★ allowPublicKeyRetrieval=true 없으면 MySQL 8 인증 에러 (Public Key Retrieval is not allowed)
        SPRING_DATASOURCE_URL: {{ printf "jdbc:mysql://%s-mysql:3306/%s?useSSL=false&allowPublicKeyRetrieval=true" .Release.Name .Values.mysql.database | quote }}
        SPRING_DATASOURCE_USERNAME: {{ .Values.mysql.username | quote }}
        SPRING_DATASOURCE_PASSWORD: "{{ `{{ .mysql_password }}` }}"
        # JWT (HS256 최소 32바이트)
        JWT_SECRET: "{{ `{{ .jwt_secret }}` }}"
  data:
    - secretKey: mysql_password
      remoteRef:
        key: realchat
        property: mysql-password
    - secretKey: jwt_secret
      remoteRef:
        key: realchat
        property: jwt-secret
