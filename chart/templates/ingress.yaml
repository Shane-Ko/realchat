# ============================================
# Ingress — traefik, HTTP only (TLS 없음 — 환경 규칙)
# host: kopo02-realchat.std.kopoctc.kr
# ============================================
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "realchat.fullname" . }}
  labels:
    {{- include "realchat.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "realchat.host" . }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "realchat.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
