# ============================================
# MySQL 8.0 — StatefulSet + headless Service + volumeClaimTemplate
# (board-project 는 Deployment+PVC 였으나, 상태ful 워크로드 정석은 StatefulSet)
# ============================================

# --- 1) headless Service: FQDN = realchat-mysql.<ns>.svc.cluster.local ---
# clusterIP: None 이면 StatefulSet 안정적 네트워크 ID 부여. Spring DB_HOST 와 일치.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysql        # ★ realchat-mysql (DB_HOST 가 가리킴)
  labels:
    app: {{ .Release.Name }}-mysql
spec:
  clusterIP: None                        # headless
  selector:
    app: {{ .Release.Name }}-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
# --- 2) StatefulSet ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mysql
  labels:
    app: {{ .Release.Name }}-mysql
  annotations:
    argocd.argoproj.io/sync-wave: "0"    # ★ 앱보다 먼저
spec:
  serviceName: {{ .Release.Name }}-mysql # headless Service 이름 (필수)
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image | quote }}    # mysql:8.0 (docker.io, Kyverno 통과)
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: realchat-mysql-auth
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: realchat-mysql-auth
                  key: mysql-password
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          # MySQL 준비 확인 (mysqladmin ping)
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
            periodSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  # PVC 자동 생성 (Pod 삭제돼도 보존)
  # storageClassName 생략 → 기본 nfs-std-1 사용 (환경 규칙)
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.persistence.size }}
