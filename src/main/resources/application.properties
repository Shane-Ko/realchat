spring.application.name=kopochat

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kopochat}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
## update : Create table if none exists, add column if field is added (use now)
## create : Deletes and recreates the table every time it is executed (data is lost)
## none : Do nothing
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true