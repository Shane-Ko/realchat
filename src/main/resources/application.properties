spring.application.name=realchat

# ===== MySQL (K8s 환경변수로 주입; 기본값은 로컬 개발용) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/realchat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kopoctc}

# ===== JPA =====
## update: 테이블이 없으면 생성, 컬럼 추가 시 반영 (운영 권고는 validate/none)
## create: 실행할 때마다 테이블 삭제 후 재생성 (데이터 손실)
## none: 아무 작업 안 함
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ===== JWT (Vault → Secret → envFrom) =====
jwt.secret=${JWT_SECRET:RealChatSecretKeyRealChatSecretKey1234}

# ===== Actuator / 프로브 =====
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
